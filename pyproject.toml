[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-usage-governor"
version = "0.1.0"
description = "Read Claude Code plan headroom, and throttle tool use before you hit the wall."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "sens8tion" }]
dependencies = []
keywords = ["claude", "claude-code", "rate-limit", "anthropic"]

[project.urls]
Repository = "https://github.com/sens8tion/claude-usage-governor"

[project.scripts]
claude-usage-governor = "claude_usage_governor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/claude_usage_governor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
